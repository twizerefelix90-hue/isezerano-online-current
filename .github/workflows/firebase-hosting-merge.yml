name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript checks
        run: npm run lint
      - name: Build SPA and prerender static Blog HTML + og-blog thumbnails
        run: npm run build
      - name: Deploy static dist to Firebase Hosting (Spark plan)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ISEZERANO_NEWS }}
          channelId: live
          projectId: isezerano-news
          firebaseToolsVersion: '15.35.0'
